name: CallRelay

options:
  bundleIdPrefix: com.jiangnangenius
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: zh-Hans
  createIntermediateGroups: true
  generateEmptyDirectories: false

settings:
  base:
    MARKETING_VERSION: "0.3.5"
    CURRENT_PROJECT_VERSION: "9"
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    GCC_TREAT_WARNINGS_AS_ERRORS: "NO"

packages:
  WebRTC:
    # Upstream Swift package tag 151.0.0 points at a release-asset URL that
    # currently 404s. We vendor a checksum-pinned local package wrapping the
    # exact M151 binary; Scripts/bootstrap.sh fetches+verifies the digest.
    path: Vendor/WebRTC

targets:
  CallRelay:
    type: application
    platform: iOS
    sources:
      - path: CallRelay
        excludes:
          - "**/.DS_Store"
    resources: []
    dependencies:
      - package: WebRTC
    info:
      path: CallRelay/Info.plist
      properties:
        CFBundleDisplayName: CallRelay
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Relaunch from a system Phone/Recents row: CallKit + INStartCallIntent
        # donations carry the call back as an NSUserActivity.
        NSUserActivityTypes:
          - INStartCallIntent
          - INStartAudioCallIntent
        UIRequiredDeviceCapabilities:
          - arm64
        UIBackgroundModes:
          - voip
          - audio
        NSMicrophoneUsageDescription: 通话时需要使用麦克风，将你的语音经网关发送到对方。
        NSCameraUsageDescription: 扫描网关上显示的配对二维码时需要使用相机；也可以选择粘贴配对内容。
        NSContactsUsageDescription: 用于在联系人中选择号码拨号或发短信、在最近通话/短信中显示联系人姓名，并可按你的选择将通讯录号码视为可信发件人。App 不会上传或备份你的通讯录。
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: CallRelay/CallRelay.entitlements
      properties:
        # iOS uses the bare `aps-environment` entitlement. The prefixed
        # com.apple.developer.aps-environment key is the macOS spelling.
        aps-environment: development
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jiangnangenius.callrelay
        # iPhone and iPad: the UI adapts (sidebar-adaptable tabs, centered
        # readable columns, landscape/split-view safe) instead of stretching.
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        # ObjC @try/@catch boundary so a missing EFFECTIVE iCloud entitlement
        # (broad profile + stripped code-signature rights, e.g. Feather) can
        # never crash on CKContainer initialization.
        SWIFT_OBJC_BRIDGING_HEADER: CallRelay/CloudSync/CallRelay-Bridging-Header.h

  CallRelayTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CallRelayTests
        excludes:
          - "UITests/**"
    dependencies:
      - target: CallRelay
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jiangnangenius.callrelay.tests
        GENERATE_INFOPLIST_FILE: "YES"

  CallRelayUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: CallRelayTests/UITests
    dependencies:
      - target: CallRelay
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jiangnangenius.callrelay.uitests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_TARGET_NAME: CallRelay

schemes:
  CallRelay:
    build:
      targets:
        CallRelay: all
        CallRelayTests: [test]
        CallRelayUITests: [test]
    test:
      targets:
        - CallRelayTests
        - CallRelayUITests
      gatherCoverageData: false
