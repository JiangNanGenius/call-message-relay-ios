name: CallRelay

options:
  bundleIdPrefix: com.jiangnangenius
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: zh-Hans
  # Product languages: Simplified Chinese (source), Traditional Chinese,
  # English. The app follows the system locale; no in-app selector.
  knownRegions:
    - zh-Hans
    - zh-Hant
    - en
  createIntermediateGroups: true
  generateEmptyDirectories: false

# Build flavors. Debug/Release are the Feather native edition and are the
# DEFAULT: they compile no web-push bridge and no callrelay:// route.
# Debug-PWA/Release-PWA compile the same core plus the optional self-hosted
# PWA web-push bridge (PWA_BRIDGE): the app mints browser bind codes for the
# gateway's own PWA (no Bark, no central service, no third-party dependency).
# Every release publishes both variants together under one marketing version;
# see docs/release.md for the release checklist.
configs:
  Debug: debug
  Release: release
  Debug-PWA: debug
  Release-PWA: release

settings:
  base:
    MARKETING_VERSION: "0.3.39"
    # v0.3.5 public build 9 stays immutable. Build 12 (0.3.5) was the
    # TestFlight CloudKit/WSS/LCK repair; build 13 ships the build-12 crash,
    # iCloud, push-environment and audio fixes in BOTH editions and adds the
    # optional bridge to the App Store edition only. Build 14 (0.3.7) repairs
    # silent relay audio, stuck direct-route switching and adds the
    # exportable redacted diagnostics log. Build 15 (0.3.8) pairs with the
    # gateway audio repair and deepens PushKit/audio diagnostics. Build 16
    # (0.3.9) replaces the App Store edition's Bark bridge with the
    # self-hosted PWA Web Push path (gateway serves an installable PWA over
    # its own HTTPS domain, owns its VAPID key and sends Web Push itself) and
    # keeps the pure native edition untouched. Build 17 (0.3.10) repairs
    # system-answer audio, makes SMS truthfulness/per-line selection real and
    # adds contact autocomplete. Build 18 (0.3.11) fixes the SMS recipient
    # field: the digits-only phonePad keyboard made contact-name autocomplete
    # unreachable even though the matcher worked, so the To field now uses the
    # normal multilingual keyboard with a "姓名或号码" placeholder (the dialer
    # keypad stays digits-only). Build 19 (0.3.12) repairs the uplink audio
    # path (gateway jitter-buffer cursor rebase; bounded engine-restart
    # recovery with per-run diagnostics; WebRTC probe manual-audio ordering),
    # restores the native VoIP push sender (gateway APNs config preservation),
    # fixes the SMS "threadKey 格式错误" screen (canonical line:peer keys,
    # legacy-key resolution, sanitized errors), rebuilds the dialer with fixed
    # compact geometry (one best match + sheet for all results, Apple-style)
    # and adds true pinyin/initial/T9 contact search with locale-aware name
    # display. Build 21 (0.3.14) repaired incoming-call audio activation after
    # the system-answer regression; build 22 (0.3.15) hardened that repair per
    # review. Build 23 (0.3.16) repairs the build-21 field defects: the field
    # log showed every must-report push carrying the full 7-key gateway
    # envelope yet failing parse with no decision line (consistent with the
    # gateway forwarding an EMPTY handle when the network withholds the caller
    # id — the one gateway-produced value that can be empty), so an empty
    # handle now parses and rings as a real call with the 未知号码 display
    # fallback while gatewayId/issuedAt validation stays mandatory; parse
    # failures now log the missing FIELD NAME for the next export; the capture
    # tap installs BEFORE the engine starts (every build-21 cold call opened
    # with a ~2 s zero-delivery tap and a forced watchdog restart; the precise
    # mechanism is a hypothesis, the pre-start install is the canonical
    # pattern) and the tap-dead verdict gets its longer grace so a merely
    # slow start is never churned by a restart it does not need.
    # Build 30 (0.3.23) pairs with the gateway audio repair: the worker
    # pre-rotates the QDC507 voice route at RING and before ATD (no more
    # silent first seconds), the daemon reports the codec actually
    # negotiated and waits for the worker bridge before greeting the
    # phone, and aplay/arecord exit/stderr reasons are preserved so the
    # next device test shows an observable failure cause. The SMS
    # delete surface (permanent Edit entry in the list, swipe/context
    # actions and the in-conversation delete menu) ships as the
    # production entry point.
    # Build 31 (0.3.24) adds a content-level 管理信息 row at the top of
    # the SMS list (visible before any editing, independent of the nav
    # toolbar) that enters the same native bulk mark-read/delete mode.
    # Build 32 (0.3.25) pairs with the gateway SMS septet-alignment fix and
    # the single-pacer uplink playback fix; the lock-screen row now shows the
    # source-backed push readiness state instead of a static instruction.
    # Build 33 (0.3.26) is a signing-only release: Scripts/sign-native-ipa.sh
    # now merges application-identifier / com.apple.developer.team-identifier /
    # get-task-allow from the certificate-verified provisioning profile into the
    # signing entitlements (build 32 omitted them and iOS refused to install)
    # and Scripts/verify-signed-ipa.py audits the package before delivery. No
    # app behaviour or gateway protocol changed.
    # Build 34 (0.3.27) repairs the build-33 field defects: the voice-chat
    # session is configured before system activation (never racing
    # AVAudioEngine.start()), a zero-delivery tap is first recovered by a
    # bounded tap reinstall (0.8 s) instead of always spending a 3 s engine
    # restart, the VP-off degraded fallback is scoped to a second dead render
    # of the SAME call (a new call no longer inherits a previous call's
    # restart), tap-callback/unusable/first-delivery evidence is logged, and
    # the route detail now labels stopped/post-call measurements truthfully
    # (a late terminal route state can no longer resurrect a frozen
    # "本次通话实时" surface).
    # Build 35 (0.3.28) makes the idle preflight candidate ACTUALLY
    # selectable and bounds startup route measurement: the call-start handoff
    # is taken before the WSS media setup (build 34 cancelled the probe in
    # `callWillStart()` before `consumeHandoff()`, so a connected, measured
    # candidate was never adopted), auto waits a bounded window for BOTH
    # sides' fresh measured RTT instead of declining on the freshly connected
    # relay's empty sample list, and when no handoff exists ONE bounded
    # startup opportunity measures a detached candidate in PARALLEL with the
    # audible relay and upgrades only on sustained material improvement
    # (single promotion, 20% median, jitter/loss ceilings), then pins the
    # route. A connected candidate is kept adoptable continuously by renewing
    # its server TTL in place (no renegotiation; builds without the renewal
    # route fall back to a fresh attach). Every adoption is gated on
    # ADVANCING two-way RTC audio since adoption (inbound + outbound RTP with
    # the RTC session enabled) within a bounded window; on failure the call
    # returns to a freshly staged relay with bounded attach retries. Because
    # the gateway's atomic commit closes the old WSS host AT adoption, the
    # handover is a single-owner sequential cutover and is explicitly NOT
    # claimed to be gapless. The selection logs its measured decision inputs
    # (sample counts, medians, jitter, stalls, wait, reason). Audio
    # capture/playback paths are untouched.
    # Build 36 (0.3.29) repairs the direct-route silent-audio root cause and
    # adds the manual escape. The gateway's adopted preflight now continues
    # the probe's RTP sequence number and 48 kHz timestamp instead of
    # restarting at 0/0: the phone's receiver had already consumed the
    # probe's silence stream on the same SSRC, so every post-adoption packet
    # looked like a stale replay (RFC 3550 old-packet / NetEq duplicate
    # logic) and the modem audio was discarded until the counters caught
    # back up — 18 s of perceived silence in the build-35 field call, longer
    # than the call itself. The client also makes the in-call route menu's
    # explicit relay choice a real make-before-break escape (stage a fresh
    # WSS attach, promote it, then close the direct peer) instead of a
    # next-call-only preference; a failed escape keeps the current transport
    # and reports it, and tapping relay again retries.
    # Build 38 (0.3.31) fences relay quality after route handover (no false
    # "音频已中断") and adopts a fresh warm direct candidate before relay on
    # the first call. Build 39 (0.3.32) adds ordinary (non-VoIP) carrier
    # arrears / designated-backup-network alerts with permission handling and
    # Settings status, plus principal-scoped gateway contacts sync (explicit
    # upsert-only action; system Contacts are only read). The web PWA gets a
    # contacts tab with vCard import preview/result, search/edit/delete/export
    # and pinyin suggestions. No call-audio or network-protocol changes.
    # Build 40 (0.3.33) serializes the cross-app audio lifecycle: the shared
    # AVAudioSession bridge now owns explicit system/self-managed ownership
    # plus interruption-began/ended, route-change and media-services
    # reset/lost observers. A real system activation is authoritative and
    # ends a pending interruption even when the OS delivers only `began`
    # (RTCAudioSession.mm contract); system-managed sessions never call
    # setActive(true) while a competing session may own audio; self-managed
    # recovery is bounded (2 attempts) and fenced by event epochs and an
    # explicit live-call audio demand, so a hangup followed by late
    # interruption/media-reset notifications can never reopen the microphone.
    # Deactivation is forwarded to the adopted direct peer and staged relay
    # handovers keep exactly one mic owner; the engine watchdog and start path
    # are suppressed while actually interrupted, route changes revalidate the
    # capture format, and a minimal honest status line replaces any silent
    # pretend-success. No gateway, network, PCM/codec or dialing changes.
    # Build 41 (0.3.34) repairs the incoming system-UI reporting path: a push
    # is suppressed only while a report is in flight, the SYSTEM accepted it,
    # or no bounded attempt remains — in-app tracking alone no longer swallows
    # a repeated must-report push, and a rejected/unresolved report is
    # observable and re-reportable. A caller id that arrives during the
    # report await is retained and applied/retried instead of dropped.
    # LCK report acceptance/rejection is exported (domain/code, no caller
    # data). Audio-session/engine work no longer runs inline in system
    # callbacks: bridge events are applied through a delivery-ordered FIFO on
    # the main actor with epoch fencing, and the voice-chat session is
    # configured when a call actually starts audio, not on the push path.
    # Build 42 (0.3.35) adds the Shortcuts/App-Intents surface: call a number
    # and compose an SMS with optional authorized-line selection (entities
    # are scoped to the current pairing principal and fail closed), plus an
    # open-destination intent (dialer/messages/voicemail). All intents are
    # open-app with a single staged runtime handoff consumed on cold start,
    # foreground or immediately when the app is already foreground; dialing
    # reuses the strict existing gateway path (explicit chooser, never a
    # silent line substitution or cellular fallback) and SMS only ever opens
    # the prefilled composer for in-app confirmation — never auto-sends.
    CURRENT_PROJECT_VERSION: "46"
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    # Compiler-driven SwiftUI string extraction into Localizable.xcstrings.
    SWIFT_EMIT_LOC_STRINGS: "YES"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    GCC_TREAT_WARNINGS_AS_ERRORS: "NO"
  configs:
    # The PWA edition is opt-in by configuration only; the default
    # Debug/Release builds can never accidentally include the bridge.
    Debug-PWA:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DEBUG PWA_BRIDGE"
    Release-PWA:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) PWA_BRIDGE"

packages:
  WebRTC:
    # Upstream Swift package tag 151.0.0 points at a release-asset URL that
    # currently 404s. We vendor a checksum-pinned local package wrapping the
    # exact M151 binary; Scripts/bootstrap.sh fetches+verifies the digest.
    path: Vendor/WebRTC

targets:
  CallRelay:
    type: application
    platform: iOS
    sources:
      - path: CallRelay
        excludes:
          - "**/.DS_Store"
          # Provenance copy of the approved icon original (not a build input).
          - "Resources/AppIconApproved/**"
    resources: []
    dependencies:
      - package: WebRTC
      # Reference libopus (BSD-3-Clause) for the WSS relay codec; built by
      # ../tools/build-libopus.sh ios into Vendor/opus/opus.xcframework.
      - framework: Vendor/opus/opus.xcframework
    info:
      path: CallRelay/Info.plist
      properties:
        CFBundleDisplayName: CallRelay
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Relaunch from a system Phone/Recents row: CallKit + INStartCallIntent
        # donations carry the call back as an NSUserActivity.
        NSUserActivityTypes:
          - INStartCallIntent
          - INStartAudioCallIntent
        # NOTE: no CFBundleURLTypes here. The callrelay:// incoming-check route
        # exists only in the PWA edition and is contributed by
        # CallRelay/Info-PWA.plist (used by the Debug-PWA/Release-PWA
        # configurations); the native Feather artifact registers no such route.
        UIRequiredDeviceCapabilities:
          - arm64
        UIBackgroundModes:
          - voip
          - audio
        NSMicrophoneUsageDescription: 通话时需要使用麦克风，将你的语音经网关发送到对方。
        NSCameraUsageDescription: 扫描网关上显示的配对二维码时需要使用相机；也可以选择粘贴配对内容。
        NSContactsUsageDescription: 用于在联系人中选择号码拨号或发短信、在最近通话/短信中显示联系人姓名，并可按你的选择将通讯录号码视为可信发件人。只有你主动点击“同步到网关”时，联系人会通过加密连接保存到你的自有网关，供同一配对密钥的设备使用；App 不会修改或删除系统通讯录，也不会发送给第三方。
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: CallRelay/CallRelay.entitlements
      properties:
        # iOS uses the bare `aps-environment` entitlement. The prefixed
        # com.apple.developer.aps-environment key is the macOS spelling.
        # Archive-time value: development (automatic signing matches a dev
        # profile); Xcode Organizer cloud-managed distribution re-signs with
        # production push for TestFlight.
        aps-environment: development
        # CloudKit (CloudSync engine): the CODE SIGNATURE must carry these —
        # portal/profile capabilities do NOT inject into the effective
        # signature by themselves (build 10 blocker). Values mirror the
        # dedicated App ID/profile exactly (UUID 2fe41a7c-…): the exact
        # dedicated container and the explicit CloudKit service ARRAY (the
        # profile's icloud-services="*" wildcard also satisfies the runtime
        # gate, but the signature declares the precise service).
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.jiangnangenius.callrelay
        com.apple.developer.icloud-services:
          - CloudKit
        # Single string (the entitlement is NSString, not an array; the
        # profile's own environment LIST is [Production, Development]).
        com.apple.developer.icloud-container-environment: Production
        com.apple.developer.ubiquity-container-identifiers:
          - iCloud.com.jiangnangenius.callrelay
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jiangnangenius.callrelay
        # iPhone and iPad: the UI adapts (sidebar-adaptable tabs, centered
        # readable columns, landscape/split-view safe) instead of stretching.
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        # ObjC @try/@catch boundary so a missing EFFECTIVE iCloud entitlement
        # (broad profile + stripped code-signature rights, e.g. Feather) can
        # never crash on CKContainer initialization.
        SWIFT_OBJC_BRIDGING_HEADER: CallRelay/CloudSync/CallRelay-Bridging-Header.h
      configs:
        # Only the PWA edition registers the callrelay:// incoming-check
        # route; the native plist stays free of any bridge route. The
        # PWA-only string catalog is likewise compiled only into the PWA
        # edition; the native bundle carries no web-push text.
        Debug:
          EXCLUDED_SOURCE_FILE_NAMES: WebPushBridge.xcstrings
        Release:
          EXCLUDED_SOURCE_FILE_NAMES: WebPushBridge.xcstrings
        Debug-PWA:
          INFOPLIST_FILE: CallRelay/Info-PWA.plist
        Release-PWA:
          INFOPLIST_FILE: CallRelay/Info-PWA.plist

  CallRelayTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CallRelayTests
        excludes:
          - "UITests/**"
    dependencies:
      - target: CallRelay
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jiangnangenius.callrelay.tests
        GENERATE_INFOPLIST_FILE: "YES"

  CallRelayUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: CallRelayTests/UITests
    dependencies:
      - target: CallRelay
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jiangnangenius.callrelay.uitests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_TARGET_NAME: CallRelay

schemes:
  CallRelay:
    build:
      targets:
        CallRelay: all
        CallRelayTests: [test]
        CallRelayUITests: [test]
    test:
      targets:
        - CallRelayTests
        - CallRelayUITests
      gatherCoverageData: false
