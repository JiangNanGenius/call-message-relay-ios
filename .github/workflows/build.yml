name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios-build-test:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4

      - name: Verify stable Xcode
        run: |
          test -d "$DEVELOPER_DIR"
          echo "$DEVELOPER_DIR/usr/bin" >> "$GITHUB_PATH"
          xcodebuild -version

      - name: Install XcodeGen
        run: command -v xcodegen || brew install xcodegen

      - name: Fetch and verify pinned WebRTC M151
        run: ./Scripts/bootstrap.sh

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Select and boot an available iPhone simulator
        run: |
          set -euo pipefail
          xcrun simctl list devices available --json > "$RUNNER_TEMP/devices.json"
          SIMULATOR_ID=$(python3 - "$RUNNER_TEMP/devices.json" <<'PY'
          import json, sys
          devices = json.load(open(sys.argv[1]))["devices"]
          candidates = [(runtime, d["udid"]) for runtime, group in devices.items()
                        if "iOS" in runtime for d in group
                        if d["name"] == "iPhone 17 Pro" and d.get("isAvailable")]
          if not candidates:
              raise SystemExit("No available iPhone 17 Pro runtime")
          print(sorted(candidates, reverse=True)[0][1])
          PY
          )
          echo "SIMULATOR_ID=$SIMULATOR_ID" >> "$GITHUB_ENV"
          xcrun simctl boot "$SIMULATOR_ID"
          xcrun simctl bootstatus "$SIMULATOR_ID" -b
          # The UI tests assert the Simplified-Chinese labels of the app's
          # zh-Hans development language. The app also ships an English
          # localization, so a default (English) runner simulator renders
          # "Call"/"Settings" and every label-based UI test fails. Pin the
          # test device to Chinese and reboot so SpringBoard picks it up.
          xcrun simctl spawn "$SIMULATOR_ID" defaults write NSGlobalDomain AppleLanguages -array zh-Hans en
          xcrun simctl spawn "$SIMULATOR_ID" defaults write NSGlobalDomain AppleLocale -string zh_CN
          xcrun simctl shutdown "$SIMULATOR_ID"
          xcrun simctl boot "$SIMULATOR_ID"
          xcrun simctl bootstatus "$SIMULATOR_ID" -b

      - name: Run tests in light appearance
        run: |
          set -euo pipefail
          xcrun simctl ui "$SIMULATOR_ID" appearance light
          xcodebuild test \
            -project CallRelay.xcodeproj -scheme CallRelay \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -parallel-testing-enabled NO \
            -derivedDataPath build/DerivedData \
            -resultBundlePath build/Tests.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Exercise SMS UI in dark appearance
        run: |
          set -euo pipefail
          xcrun simctl ui "$SIMULATOR_ID" appearance dark
          xcodebuild test-without-building \
            -project CallRelay.xcodeproj -scheme CallRelay \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath build/DerivedData \
            -parallel-testing-enabled NO \
            -only-testing:CallRelayUITests \
            -resultBundlePath build/Tests-Dark.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Export UI screenshots
        if: always()
        run: |
          for appearance in Light Dark; do
            bundle=build/Tests.xcresult
            if [ "$appearance" = Dark ]; then bundle=build/Tests-Dark.xcresult; fi
            if [ -d "$bundle" ]; then
              xcrun xcresulttool export attachments --path "$bundle" --output-path "build/UITestScreens/$appearance"
            fi
          done

      - name: Save UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sms-ui-screens
          path: build/UITestScreens
          if-no-files-found: ignore

      - name: Launch offline demo and capture its screen
        run: |
          set -euo pipefail
          mkdir -p build/Preview
          xcrun simctl install "$SIMULATOR_ID" build/DerivedData/Build/Products/Debug-iphonesimulator/CallRelay.app
          xcrun simctl ui "$SIMULATOR_ID" appearance light
          xcrun simctl terminate "$SIMULATOR_ID" com.jiangnangenius.callrelay || true
          xcrun simctl launch "$SIMULATOR_ID" com.jiangnangenius.callrelay -callrelay.demoMode YES
          sleep 5
          xcrun simctl io "$SIMULATOR_ID" screenshot build/Preview/dialer-light.png
          xcrun simctl ui "$SIMULATOR_ID" appearance dark
          sleep 2
          xcrun simctl io "$SIMULATOR_ID" screenshot build/Preview/dialer-dark.png
          xcrun simctl ui "$SIMULATOR_ID" appearance light

      - name: Save demo screen
        uses: actions/upload-artifact@v4
        with:
          name: demo-screen
          path: build/Preview/*.png

      - name: Build and package both unsigned editions
        run: |
          set -euo pipefail
          DERIVED_DATA_ROOT=build/release-variants \
            ./Scripts/package-release-variants.sh --output-dir build/release

      - name: Validate Feather source generator (native-only)
        run: |
          set -euo pipefail
          NATIVE_APP=build/release-variants/native/Build/Products/Release-iphoneos/CallRelay.app
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$NATIVE_APP/Info.plist")"
          NATIVE_IPA="$(ls build/release/CallRelay-Feather-Native-*-unsigned.ipa)"
          ./Scripts/update-feather-source.py "$NATIVE_IPA" --tag "v$VERSION" \
            --feed feather.json --output build/release/feather.ci.json
          python3 - "$NATIVE_IPA" build/release/feather.ci.json <<'PY'
          import json, sys
          ipa_name = sys.argv[1].rsplit("/", 1)[-1]
          feed = json.load(open(sys.argv[2]))
          url = feed["apps"][0]["downloadURL"]
          assert url.endswith("/" + ipa_name), url
          print("Feather feed generated and native-only:", url)
          PY

      - name: Save unsigned IPAs
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-ipas
          path: |
            build/release/CallRelay-*-unsigned.ipa
            build/release/SHA256SUMS.public.txt

      - name: Save test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: build/Tests*.xcresult
          if-no-files-found: ignore
